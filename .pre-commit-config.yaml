repos:
  - repo: local
    hooks:
      - id: just pre-commit-hook
        name: just pre-commit-hook
        entry: just pre-commit-hook
        language: unsupported
        pass_filenames: false
      - id: check-commit-message
        name: Validate Commit Message Format
        entry: |
          /bin/sh -c '
          REGEXP="^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-zA-Z0-9_-]+\))?!?: .+$";
          MSG=$(cat "$1");
          if ! echo "$MSG" | grep -Eq "$REGEXP"; then
            echo "❌ ERROR: Invalid commit message format.";
            echo "Expected: <type>(<scope>): <description>";
            echo "Example:  feat(net): add retransmission knob";
            exit 1;
          fi' --
        language: system
        stages: [commit-msg]
        always_run: true
